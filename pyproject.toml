[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "db3-atlassian-mcp"
version = "1.3.1"
description = "Atlassian MCP Server — Jira and Confluence tools for AI IDEs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    { name = "David Black", email = "dblack@merchante.com" },
]
keywords = ["mcp", "atlassian", "jira", "confluence", "kiro", "ai", "ide"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/db3net/db3-atlassian-mcp"
Repository = "https://github.com/db3net/db3-atlassian-mcp"

[project.scripts]
db3-atlassian-mcp = "server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["server.py"]
